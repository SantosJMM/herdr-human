id = "herdr-human"
name = "Herdr Human"
version = "0.1.1"
min_herdr_version = "0.8.0"
description = "Friendly names instead of ids: list, find, message and rename herdr agents across machines with the hum command."
platforms = ["linux", "macos", "windows"]

# Instalación: descargan el binario del release de GitHub (SHA-256 comprobado) y,
# si no se puede, compilan con Go. Ver scripts/install.sh y scripts/install.ps1.
[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/install.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install.ps1"]

# Todas las acciones y los panes arrancan bin/hum DIRECTAMENTE: herdr completa el
# .exe en Windows y usa la raíz del plugin como carpeta de trabajo. Antes pasaban
# por powershell.exe (o sh), que en Windows cuesta cerca de un segundo por cada
# arranque, y una acción más su pane lo pagaban dos veces. Hay un test
# (cmd/hum/manifest_test.go) que falla si vuelve un intérprete.
#
# Las acciones X-windows y X-unix hacen lo mismo: se conservan los dos ids porque
# los atajos de config.toml ya los usan (p. ej. herdr-human.pick-windows). Los
# panes, en cambio, tienen una sola definición para todas las plataformas.
# `hum popup <nombre>` abre el pane del mismo nombre.

[[actions]]
id = "overview-windows"
title = "Show all agents (hum ls)"
contexts = ["workspace", "tab", "pane"]
platforms = ["windows"]
command = ["bin/hum", "popup", "overview"]

[[actions]]
id = "overview-unix"
title = "Show all agents (hum ls)"
contexts = ["workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ["bin/hum", "popup", "overview"]

[[actions]]
id = "machines-windows"
title = "Manage saved machines (hum machines menu)"
contexts = ["workspace", "tab", "pane"]
platforms = ["windows"]
command = ["bin/hum", "popup", "machines"]

[[actions]]
id = "machines-unix"
title = "Manage saved machines (hum machines menu)"
contexts = ["workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ["bin/hum", "popup", "machines"]

[[actions]]
id = "pick-windows"
title = "Talk to agents (hum pick)"
contexts = ["workspace", "tab", "pane"]
platforms = ["windows"]
command = ["bin/hum", "popup", "pick"]

[[actions]]
id = "pick-unix"
title = "Talk to agents (hum pick)"
contexts = ["workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ["bin/hum", "popup", "pick"]

[[actions]]
id = "attention-windows"
title = "Who needs me? (hum attention)"
contexts = ["workspace", "tab", "pane"]
platforms = ["windows"]
command = ["bin/hum", "popup", "attention"]

[[actions]]
id = "attention-unix"
title = "Who needs me? (hum attention)"
contexts = ["workspace", "tab", "pane"]
platforms = ["linux", "macos"]
command = ["bin/hum", "popup", "attention"]

# Paleta de comandos: se enlaza con type = "plugin_action" y el comando
# "herdr-human.palette". Su pane se abre con `hum palette open`.
[[actions]]
id = "palette"
title = "Open command palette"
contexts = ["workspace", "tab", "pane"]
command = ["bin/hum", "palette", "open"]

[[panes]]
id = "overview"
title = "Herdr agents"
placement = "popup"
width = "80%"
height = "70%"
command = ["bin/hum", "popup", "show", "ls"]

[[panes]]
id = "machines"
title = "Herdr machines"
placement = "popup"
width = "90%"
height = "65%"
command = ["bin/hum", "machines", "menu"]

[[panes]]
id = "pick"
title = "Talk to agents"
placement = "popup"
width = "90%"
height = "80%"
command = ["bin/hum", "pick"]

[[panes]]
id = "attention"
title = "Who needs me"
placement = "popup"
width = "80%"
height = "60%"
command = ["bin/hum", "popup", "show", "attention"]

[[panes]]
id = "palette"
title = "Command palette"
placement = "popup"
width = "70%"
height = "60%"
command = ["bin/hum", "palette"]
